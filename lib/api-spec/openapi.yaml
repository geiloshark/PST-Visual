openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for the pstom R package UI
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: r
    description: R package execution
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /r/status:
    get:
      operationId: getRStatus
      tags: [r]
      summary: Check R and pstom availability
      description: Returns whether R is installed and the pstom package is available
      responses:
        "200":
          description: R status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RStatus"

  /r/pdyn:
    post:
      operationId: runPdyn
      tags: [r]
      summary: Run the pdyn function
      description: Executes pdyn with the provided S4 object file ID and arguments. Returns a session with the saved RDS output.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdynInput"
      responses:
        "200":
          description: pdyn executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "500":
          description: R execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /r/dynplot:
    post:
      operationId: runDynplot
      tags: [r]
      summary: Run the dynplot function
      description: Executes dynplot using the S4 output from a previous pdyn session. Returns a session with a PNG plot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynplotInput"
      responses:
        "200":
          description: dynplot executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
        "500":
          description: R execution error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

  /r/sessions:
    get:
      operationId: listSessions
      tags: [r]
      summary: List all R sessions
      description: Returns all saved pdyn and dynplot sessions in reverse chronological order
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"

  /r/sessions/{id}:
    get:
      operationId: getSession
      tags: [r]
      summary: Get a session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"
    delete:
      operationId: deleteSession
      tags: [r]
      summary: Delete a session and its output files
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session deleted
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RStatus:
      type: object
      required: [rAvailable, pstomInstalled]
      properties:
        rAvailable:
          type: boolean
        pstomInstalled:
          type: boolean
        rVersion:
          type: ["string", "null"]
        pstomVersion:
          type: ["string", "null"]

    PdynInput:
      type: object
      required: [fileId]
      properties:
        fileId:
          type: string
          description: ID of the uploaded RDS file containing the S4 input object
        stochastic:
          type: ["boolean", "null"]
          description: Whether to use stochastic dynamics (default TRUE)
        iterations:
          type: ["number", "null"]
          description: Number of iterations
        time:
          type: ["number", "null"]
          description: Time horizon
        initialDepletion:
          type: ["number", "null"]
          description: Initial depletion level
        verbose:
          type: ["boolean", "null"]
          description: Whether to print verbose output
        useRmax:
          type: ["boolean", "null"]
          description: Whether to use Rmax

    DynplotInput:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
          description: ID of a successful pdyn session whose output to plot
        pars:
          type: ["string", "null"]
          description: Comma-separated parameter names to plot (e.g. "N,B,F")

    Session:
      type: object
      required: [id, type, status, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          description: "pdyn or dynplot"
        status:
          type: string
          description: "success or error"
        createdAt:
          type: string
        args:
          type: object
          additionalProperties: true
        outputFileId:
          type: ["string", "null"]
          description: File ID of the saved RDS output (pdyn sessions)
        plotId:
          type: ["string", "null"]
          description: File ID of the saved PNG plot (dynplot sessions)
        logs:
          type: ["string", "null"]
          description: R stdout/stderr output
        error:
          type: ["string", "null"]
          description: Error message if status is error
        inputFileId:
          type: ["string", "null"]
          description: File ID of the input RDS (for pdyn sessions)

    ErrorResult:
      type: object
      required: [error]
      properties:
        error:
          type: string
