kind = "web"
previewPath = "/"
title = "pstom R Interface"
description = "A web interface for running functions from the pstom R package. Users can upload an S4 object, fill in arguments for pdyn and dynplot, view generated ggplot2 plots, and download saved R outputs."
version = "1.0.0"
id = "artifacts/pstom-ui"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22816

[services.development]
run = "pnpm --filter @workspace/pstom-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pstom-ui", "run", "build" ]
serve = "static"
publicDir = "artifacts/pstom-ui/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22816"
BASE_PATH = "/"
